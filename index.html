<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QuickNotes API client practice project">
  <title>QuickNotes | API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <p class="eyebrow">API CLIENT DEMO</p>
      <h1>QuickNotes</h1>
      <p>Practice loading, creating, and deleting notes through a REST API.</p>
    </header>

    <section class="panel" aria-labelledby="create-heading">
      <h2 id="create-heading">Create a note</h2>
      <form id="note-form">
        <div class="field">
          <label for="title-input">Title <span aria-hidden="true">*</span></label>
          <input id="title-input" name="title" type="text" maxlength="100"
                 required aria-describedby="title-help">
          <small id="title-help">Required. Maximum 100 characters.</small>
        </div>
        <div class="field">
          <label for="body-input">Body (optional)</label>
          <textarea id="body-input" name="body" rows="4"></textarea>
        </div>
        <button id="submit-btn" type="submit">Create note</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="notes-heading">
      <div class="notes-header">
        <div>
          <h2 id="notes-heading">Your notes</h2>
          <p class="muted">Demo data is provided by JSONPlaceholder.</p>
        </div>
        <button id="load-btn" type="button">Load notes</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">Ready. Load notes to begin.</p>
      <ul id="notes-list" aria-live="polite"></ul>
    </section>
    <footer><p>Learning project · JSONPlaceholder practice API</p></footer>
  </main>
</body>
</html>
